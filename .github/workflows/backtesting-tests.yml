name: Backtesting regression tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backtesting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy pandas pytest requests python-telegram-bot
      - name: Compile changed Python modules
        run: python -m py_compile main.py config.py execution.py data_feed.py backtest_engine.py strategy_research.py market_regime.py ops_dashboard.py mt5_broker.py delta_broker.py execution_engine.py multi_agent_trading_bot.py autonomous_learner.py strategy_profiles.py mt5_accounts.py signal_pipeline.py
      - name: Run backtesting, execution, broker safety, and fault recovery regression tests
        run: python -m pytest -q
