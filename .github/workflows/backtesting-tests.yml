name: Backtesting regression tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backtesting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy pandas pytest
      - name: Run backtesting and execution regression tests
        run: python -m pytest -q tests/test_backtest_engine.py tests/test_execution_engine.py
